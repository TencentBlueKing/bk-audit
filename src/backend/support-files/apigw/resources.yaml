  /mcp/risks/{risk_id}/strategy_info/:
    get:
      operationId: mcp_retrieve_risk_strategy_info
      description: >-
        获取当前用户可查看风险的策略下钻配置。Agent 应先调用 mcp_retrieve_risk 获取 event_time/event_end_time，
        再选择 drill_config.tool.uid 调用 mcp_execute_tool，并按 config 组装 tool_variables；风险下钻且
        params.tool_variables 非空时，必须同时传入风险调用方上下文、drill_field、event_start_time 和 event_end_time。
      tags: []
      parameters:
        - in: path
          name: risk_id
          type: string
          required: true
          description: 风险ID；后续调用 execute_tool 时作为 caller_resource_id 使用。
      responses:
        "200":
          description: 成功
          schema:
            type: object
            properties:
              risk_level:
                type: string
                description: 风险等级
                enum:
                  - LOW
                  - MIDDLE
                  - HIGH
              risk_hazard:
                type: string
                description: 风险危害
              risk_guidance:
                type: string
                description: 处理指引
              event_basic_field_configs:
                type: array
                description: 事件基础字段配置。APIGW 默认仅返回配置了 drill_config 的字段，可作为 execute_tool.drill_field。
                items:
                  type: object
                  properties:
                    field_name:
                      type: string
                      description: 字段名
                    display_name:
                      type: string
                      description: 显示名称
                    is_priority:
                      type: boolean
                      description: 是否优先展示
                    description:
                      type: string
                      description: 字段描述
                    drill_config:
                      type: array
                      description: >-
                        当前字段可用的下钻工具配置。每个元素对应一个可调用工具；调用 execute_tool 时，
                        path uid 使用 tool.uid，body.drill_field 使用当前字段的 field_name，
                        body.params.tool_variables 按 config 逐项生成。
