  /{namespace}/tools/{uid}/execute/:
    post:
      operationId: execute_tool
      description: >-
        执行工具。若基于 retrieve_risk_strategy_info 返回的 drill_config 做风险下钻，
        请同时传 caller_resource_type=risk、caller_resource_id=风险ID、drill_field=所选字段 field_name、
        event_start_time/event_end_time，以及按 drill_config.config 生成的 params.tool_variables。
        后端会使用风险事件数据校验 tool_variables 是否符合该字段的 drill_config。
      tags: []
      parameters:
        - in: path
          name: namespace
          type: string
          required: true
          description: 命名空间
        - in: path
          name: uid
          type: string
          required: true
          description: 工具唯一标识；风险下钻时使用 retrieve_risk_strategy_info 返回的 drill_config.tool.uid。
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - params
            properties:
              params:
                type: object
                description: 工具执行参数。风险下钻时按 retrieve_risk_strategy_info 返回的 drill_config.config 组装 tool_variables。
                properties:
                  tool_variables:
                    type: array
                    description: >-
                      工具变量列表。风险下钻时每一项由 drill_config.config 生成：
                      raw_name 使用 source_field，value 按 target_value_type/target_value/target_field_type
                      从固定值或风险事件数据中取值。
                    items:
                      type: object
                      properties:
                        raw_name:
                          type: string
                          description: 工具变量原始名称；风险下钻时填写 drill_config.config[].source_field。
                        value:
                          type: string
                          description: >-
                            工具变量值，类型根据工具变量决定（string/number/array 等）。风险下钻时：
                            fixed_value 直接填写 target_value；field 从风险事件记录中读取 target_value 指定的字段值。
                  page:
                    type: integer
                    description: 页码（仅 data_search 类型）
                    default: 1
                  page_size:
                    type: integer
                    description: 每页数量（仅 data_search 类型）
                    default: 100
              caller_resource_type:
                type: string
                description: 调用方资源类型。风险下钻时固定传 risk，用于声明本次工具执行来自风险上下文。
              caller_resource_id:
                type: string
                description: 调用方资源实例ID。风险下钻时传风险ID，应与 retrieve_risk_strategy_info 的 id 一致。
              drill_field:
                type: string
                description: >-
                  指定使用哪个策略字段的 drill_config 进行变量值校验。风险下钻时传所选字段的 field_name，
                  后端仅使用该字段下与当前 uid 匹配的 config 校验 params.tool_variables。
              event_start_time:
                type: string
                description: >-
                  风险事件开始时间，用于后端调用 list_event 获取事件数据。tool_variables 的值来源于风险字段时，
                  需要与 drill_field、event_end_time 一起传入。
              event_end_time:
                type: string
                description: >-
                  风险事件结束时间，用于后端调用 list_event 获取事件数据。tool_variables 的值来源于风险字段时，
                  需要与 drill_field、event_start_time 一起传入。
      responses:
        "200":
          description: 执行成功
          schema:
            type: object
            required:
              - data
              - tool_type
            properties:
              data:
                type: object
                description: 执行结果数据，结构根据 tool_type 不同而不同
              tool_type:
                type: string
                description: 工具类型
                enum:
                  - data_search
                  - api
                  - bk_vision
        default:
          description: ""
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /api/v1/namespaces/{namespace}/tool_apigw/{uid}/execute/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          appVerifiedRequired: true
          userVerifiedRequired: false
        disabledStages: []
        descriptionEn:

