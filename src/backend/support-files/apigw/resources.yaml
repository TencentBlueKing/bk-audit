                      description: 风险状态
                    current_operator:
                      type: array
                      items:
                        type: string
                      description: 当前处理人
                    notice_users:
                      type: array
                      items:
                        type: string
                      description: 关注人
                    risk_label:
                      type: string
                      description: 风险标记
                    last_operate_time:
                      type: string
                      format: date-time
                      description: 最后操作时间
                    title:
                      type: string
                      description: 风险标题
                    tags:
                      type: array
                      items:
                        type: integer
                      description: 标签ID列表
                    has_report:
                      type: boolean
                      description: 是否已生成报告
                    report_enabled:
                      type: boolean
                      description: 命中策略是否启用报告
                    report_auto_render:
                      type: boolean
                      description: 命中策略是否自动生成报告
                    detail:
                      type: object
                      description: 风险单详情（仅当请求参数 with_detail=true 时返回）
                      properties:
                        risk_id:
                          type: string
                          description: 风险ID
                        event_content:
                          type: string
                          description: 风险描述
                        raw_event_id:
                          type: string
                          description: 原始事件ID
                        strategy_id:
                          type: integer
                          description: 策略ID
                        event_evidence:
                          type: string
                          description: 风险证据
                        event_type:
                          type: array
                          items:
                            type: string
                          description: 风险类型
                        event_data:
                          type: object
                          description: 事件数据
                        event_time:
                          type: string
