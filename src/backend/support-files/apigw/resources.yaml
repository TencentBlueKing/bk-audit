                type: string
                description: 风险描述（支持模糊匹配）
              risk_label:
                type: string
                description: 风险标记
                enum:
                  - normal
                  - misreport
              risk_level:
                type: string
                description: 风险等级
                enum:
                  - LOW
                  - MIDDLE
                  - HIGH
              title:
                type: string
                description: 风险标题（支持模糊匹配）
              event_filters:
                type: array
                description: 关联事件字段筛选。
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      description: 字段名
                    display_name:
                      type: string
                      description: 字段显示名
                    operator:
                      type: string
                      description: 操作符
                      enum:
                        - "="
                        - "!="
                        - "CONTAINS"
                        - "NOT CONTAINS"
                        - "IN"
                        - "NOT IN"
                        - ">="
                        - "<="
                        - ">"
                        - "<"
                    value:
                      description: 筛选值，类型由字段决定
              sort:
                type: array
                description: 多字段排序数组。字段名前缀 - 表示倒序，如 ["-risk_level", "-event_time", "-risk_id"]；支持 risk_level、event_time、last_operate_time、risk_id、display_status、event_data.xxx。
                items:
                  type: string
                default:
                  - -event_time
              has_report:
                type: boolean
                description: 是否已生成报告
              with_detail:
                type: boolean
                description: 是否返回风险单详情（默认 false，为 true 时每条结果会额外包含 detail 字段）
                default: false
      responses:
        '200':
