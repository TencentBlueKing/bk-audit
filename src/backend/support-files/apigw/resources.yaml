  /mcp/{namespace}/logs/aggregate/:
    post:
      operationId: mcp_aggregate_logs
      description: 对当前用户可访问日志执行类型化聚合。最多 2 个维度、5 个指标和 100 个分组；AUTO 时间桶按已验证时间范围决定，转换质量在 data_quality 返回，完整响应最大 1 MiB。
      tags: []
      parameters:
        - in: path
          name: namespace
          type: string
          required: true
          description: 命名空间，仅由 URL path 提供，不能在请求体伪造。
        - in: body
          name: body
          required: true
          schema:
            type: object
            additionalProperties: false
            required: [condition, metrics]
            properties:
              condition:
                $ref: '#/definitions/log_tool_condition'
              dimensions:
                type: array
                maxItems: 2
                default: []
                items:
                  type: object
                  additionalProperties: false
                  required: [id, type, field]
                  properties:
                    id: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', description: 维度唯一 ID，仅允许字母开头。}
                    type:
                      type: string
                      enum: [FIELD, TIME_BUCKET]
                      description: FIELD 按字段分组且不得传 interval；TIME_BUCKET 只能使用无 keys 的 start_time，必须传 interval。
                    field:
                      allOf:
                        - $ref: '#/definitions/log_tool_field_ref'
                      description: FIELD 允许的根字段仅限 action_id、resource_type_id、username、result_code、access_type、start_time、extend_data，extend_data 必须带 keys；TIME_BUCKET 只能使用无 keys 的 start_time。
                    interval:
                      type: string
                      default: null
                      x-nullable: true
                      enum: [AUTO, MINUTE, HOUR, DAY]
                      description: FIELD 必须省略；TIME_BUCKET 必填，可选 AUTO、MINUTE、HOUR、DAY；AUTO 由服务按时间范围选择实际粒度。
                description: 0 至 2 个维度；最多一个 TIME_BUCKET，AUTO 会选择实际粒度。
              metrics:
                type: array
                minItems: 1
                maxItems: 5
                items:
                  type: object
                  additionalProperties: false
                  required: [id, type]
                  properties:
                    id: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', description: 指标唯一 ID，仅允许字母开头。}
                    type:
                      type: string
                      enum: [COUNT, DISTINCT_COUNT, MIN, MAX, AVG, SUM, PERCENTILE_APPROX]
                      description: COUNT 仅 COUNT(*)，必须省略 field/value_type/percentile；DISTINCT_COUNT 必须传 field 且省略 value_type/percentile；MIN/MAX/AVG/SUM 必须传 field，按字段类型决定 value_type 且必须省略 percentile；PERCENTILE_APPROX 同数值指标并额外必须传 0 < percentile < 1。
                    field:
                      type: object
                      default: null
                      x-nullable: true
                      additionalProperties: false
                      required: [raw_name]
                      properties:
                        raw_name:
                          type: string
                          minLength: 1
                          description: 受控根字段名；不接受 SQL、表达式、函数或任意 JSONPath。
                        keys:
                          type: array
                          default: []
                          maxItems: 16
                          items:
                            type: string
                            maxLength: 128
                            pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
                          description: extend_data 的安全子路径；标准字段必须为空数组，完整字段路径最大 1024 bytes。
                        field_type:
                          type: string
                          default: null
                          x-nullable: true
                          description: 可选声明类型，用于字段元信息或安全数值转换。
                      description: COUNT 必须省略；其余指标必须传。允许的根字段仅限 action_id、resource_type_id、username、result_code、access_type、start_time、extend_data；extend_data 必须带 keys。
                    value_type:
                      type: string
                      default: null
                      x-nullable: true
                      enum: [LONG, DOUBLE]
                      description: COUNT/DISTINCT_COUNT 必须省略；MIN/MAX/AVG/SUM/PERCENTILE_APPROX 对字符串或 extend_data 数值聚合必须传 LONG 或 DOUBLE，标准数值字段必须省略。
                    percentile:
                      type: number
                      format: double
                      default: null
                      x-nullable: true
                      exclusiveMinimum: true
                      minimum: 0
                      exclusiveMaximum: true
                      maximum: 1
                      description: 仅 PERCENTILE_APPROX 必填且满足 0 < percentile < 1；其余指标必须省略。
                description: 1 至 5 个固定聚合指标；不接受 SQL、任意函数名或表达式。
              order_by:
                type: array
                default: []
                description: 可选排序，只能引用已声明的维度或指标 ID。
                items:
                  type: object
                  additionalProperties: false
                  required: [target_id, direction]
                  properties:
                    target_id: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', description: 已声明维度或指标的 ID。}
                    direction: {type: string, enum: [ASC, DESC], description: 固定排序方向 ASC 或 DESC。}
              limit:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
                description: 返回分组数；运行配置只能进一步收紧，服务通过多取一行计算 has_more。
      responses:
        "200":
          description: 类型化聚合结果
          schema:
            type: object
            required: [result, code, message, request_id, trace_id, data]
            properties:
              result: {type: boolean}
              code: {type: integer}
              message: {type: string, x-nullable: true}
              request_id: {type: string, x-nullable: true}
              trace_id: {type: string, x-nullable: true}
              data:
                type: object
                required: [columns, rows, query_summary, data_quality]
                properties:
                  columns:
                    type: array
                    items:
                      type: object
                      required: [id, name, role, data_type, effective_time_interval]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        role: {type: string, enum: [DIMENSION, METRIC]}
                        data_type: {type: string}
                        effective_time_interval: {type: string, x-nullable: true, enum: [MINUTE, HOUR, DAY]}
                  rows:
                    type: array
                    maxItems: 100
                    items: {type: object}
                    description: 每行仅使用请求中声明的 ID 作为键。
                  query_summary:
                    type: object
                    required: [returned_count, has_more, took_ms, executed_at]
                    properties:
                      returned_count: {type: integer}
                      has_more: {type: boolean}
                      took_ms: {type: integer}
                      executed_at: {type: string}
                  data_quality:
                    type: array
                    items:
                      type: object
                      required: [metric_id, non_empty_count, converted_count, conversion_failed_count]
                      properties:
                        metric_id: {type: string}
                        non_empty_count: {type: integer}
                        converted_count: {type: integer}
                        conversion_failed_count: {type: integer}
        default:
          description: 平台标准错误响应
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /api/v1/query/namespaces/{namespace}/mcp_user/logs/aggregate/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          appVerifiedRequired: true
          userVerifiedRequired: true
          resourcePermissionRequired: true
        disabledStages: []
        descriptionEn:
