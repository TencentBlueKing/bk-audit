  /mcp/{namespace}/logs/field_metadata/:
    post:
      operationId: mcp_get_log_field_metadata
      description: 探索当前用户有权限访问日志的字段元信息。仅从最多 50 条已脱敏样例统计，不递归展开 JSON 对象；完整响应最大 1 MiB，字段或权限错误可修正参数后重试。
