  /mcp/{namespace}/logs/search/:
    post:
      operationId: mcp_search_logs
      description: 查询当前用户可访问的已脱敏日志明细。省略 fields 时使用紧凑默认列；显式列最多 20 个，页码和页大小最多 100，超时可缩小范围后重试。
      tags: []
      parameters:
        - in: path
          name: namespace
          type: string
          required: true
          description: 命名空间，仅由 URL path 提供，不能在请求体伪造。
        - in: body
          name: body
          required: true
          schema:
            type: object
            additionalProperties: false
            required: [condition]
            properties:
              condition:
                $ref: '#/definitions/log_tool_condition'
              fields:
                type: array
                minItems: 1
                maxItems: 20
                default: null
                x-nullable: true
                items: {$ref: '#/definitions/log_tool_field_ref'}
                description: 可选受控投影列；省略时使用紧凑默认列。
              sort:
                type: array
                maxItems: 3
                default: []
                items:
                  type: object
                  additionalProperties: false
                  required: [field]
                  properties:
                    field: {$ref: '#/definitions/log_tool_field_ref'}
                    direction:
                      type: string
                      enum: [asc, desc]
                      default: desc
                description: 最多 3 项；一期仅支持 start_time，未提供时使用稳定默认排序。
              page:
                type: integer
                minimum: 1
                maximum: 100
                default: 1
                description: 页码；运行配置只能进一步收紧最大值。
              page_size:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
                description: 每页条数；运行配置只能进一步收紧最大值。
      responses:
        "200":
          description: 脱敏日志分页结果
          schema:
            type: object
            required: [result, code, message, request_id, trace_id, data]
            properties:
              result: {type: boolean}
              code: {type: integer}
              message: {type: string, x-nullable: true}
              request_id: {type: string, x-nullable: true}
              trace_id: {type: string, x-nullable: true}
              data:
                type: object
                required: [total, columns, items, pagination, query_summary]
                properties:
                  total: {type: integer}
                  columns:
                    type: array
                    items:
                      type: object
                      required: [field, key, display_name, description, options]
                      properties:
                        field: {$ref: '#/definitions/log_tool_field_ref_response'}
                        key: {type: string, description: items 中稳定且无歧义的字段键。}
                        display_name: {type: string}
                        description: {type: string}
                        options: {type: array, x-nullable: true, items: {$ref: '#/definitions/log_tool_option'}}
                  items:
                    type: array
                    items: {type: object}
                    description: 已脱敏日志行，只含 columns 声明的稳定键。
                  pagination:
                    type: object
                    required: [page, page_size, total, returned_count, has_more]
                    properties:
                      page: {type: integer}
                      page_size: {type: integer}
                      total: {type: integer}
                      returned_count: {type: integer}
                      has_more: {type: boolean}
                  query_summary: {$ref: '#/definitions/log_tool_query_summary'}
        default:
