swagger: "2.0"
basePath: /
info:
  version: "0.1"
  title: API Gateway Resources
  description: ""
schemes:
  - http
definitions:
  log_tool_field_ref:
    type: object
    additionalProperties: false
    required: [raw_name]
    properties:
      raw_name:
        type: string
        minLength: 1
        description: 已声明的标准字段，或 extend_data。
      keys:
        type: array
        default: []
        maxItems: 16
        items:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        description: extend_data 的安全子路径；标准字段必须为空数组，完整字段路径最大 1024 bytes。
      field_type:
        type: string
        default: null
        x-nullable: true
        description: 可选声明类型，用于字段元信息或安全数值转换。
  log_tool_field_ref_response:
    type: object
    required: [raw_name, keys, field_type]
    properties:
      raw_name: {type: string}
      keys:
        type: array
        maxItems: 16
        items:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        description: extend_data 的安全子路径；标准字段必须为空数组，完整字段路径最大 1024 bytes。
      field_type:
        type: string
        x-nullable: true
  log_tool_condition_field:
    type: object
    additionalProperties: false
    required: [raw_name]
    properties:
      raw_name: {type: string, minLength: 1}
      field_type: {type: string, default: null, x-nullable: true}
      keys:
        type: array
        default: []
        maxItems: 16
        items: {type: string, maxLength: 128, pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}
        description: 最多 16 段 ASCII 安全子键；完整字段路径 UTF-8 最大 1024 bytes。
  log_tool_condition:
    type: object
    description: 单系统日志检索条件；服务端会按当前用户重新鉴权。最多 100 个条件，完整 condition 的 UTF-8 JSON 最大 256 KiB。
    additionalProperties: false
    required: [scope_id, start_time, end_time]
    properties:
      scope_type:
        type: string
        enum: [system]
        default: system
      scope_id:
        type: string
        minLength: 1
        maxLength: 255
        description: 当前查询的单个系统 ID；服务端按真实用户重新鉴权。
      start_time:
        type: string
        minLength: 1
        description: 查询开始时间，ISO 8601 带时区或 YYYY-MM-DD HH:mm:ss。
      end_time:
        type: string
        minLength: 1
        description: 查询结束时间，ISO 8601 带时区或 YYYY-MM-DD HH:mm:ss。
      conditions:
        type: array
        default: []
        maxItems: 100
        items:
          type: object
          additionalProperties: false
          required: [field, operator]
          properties:
            field: {$ref: '#/definitions/log_tool_condition_field'}
            operator:
              type: string
              minLength: 1
              description: 日志检索支持的操作符；服务端会按字段白名单校验。
            filters:
              type: array
              default: []
              maxItems: 1000
              items: {}
              description: 最多 1000 个比较值；单个值的 UTF-8 JSON 最大 16 KiB。
  log_tool_option:
    type: object
    required: [id, name]
    properties:
      id: {type: string}
      name: {type: string}
  log_tool_query_summary:
    type: object
    required: [scope_type, scope_id, time_range, condition_count, source, took_ms, executed_at]
    properties:
      scope_type: {type: string, enum: [system]}
      scope_id: {type: string}
      time_range:
        type: object
        additionalProperties: {type: string}
      condition_count: {type: integer}
      source: {type: string, enum: [natural_language, field_condition]}
      took_ms: {type: integer}
      executed_at: {type: string}
paths:
  /asset/pull_info/:
    get:
      operationId: asset_pull_info
      description: 获取反向拉取鉴权信息
      tags: []
      responses:
        default:
          description: ""
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: get
          path: /api/v1/meta/meta/asset_pull_info/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: true
        disabledStages: []
        descriptionEn:
  /risks/fields/:
    get:
      operationId: get_risk_fields
      description: 获取风险字段列表
      tags: []
      responses:
        default:
          description: ""
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: get
          path: /api/v1/risk_apigw/risk_fields_by_strategy/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: true
        disabledStages: []
        descriptionEn:
  /risks/event_fields_brief/:
    get:
      operationId: list_event_fields_by_strategy_brief
      description: 获取风险关联事件的可用筛选字段（简化版）。当用户查询涉及事件数据字段时，调用此接口获取可用字段列表。返回字段的 field_name 和 display_name，按 field_name 去重。
      tags: []
      parameters:
        - in: query
          name: strategy_ids
          type: string
          required: false
          description: 策略ID列表，逗号分隔。不传则返回所有策略的字段。
        - in: query
          name: keyword
          type: string
          required: false
          description: 按字段名或显示名模糊搜索，多个关键字用逗号分隔（OR 匹配）。例如 "源IP,来源IP" 可匹配 display_name 中包含"源IP"或"来源IP"的字段。
      responses:
        "200":
          description: 成功
          schema:
            type: object
            properties:
              results:
                type: array
                items:
                  type: object
                  properties:
                    field_name:
                      type: string
                      description: 字段名
                    display_name:
                      type: string
                      description: 字段显示名（与 field_name 相同时不返回）
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: get
          path: /api/v1/risk_apigw/event_fields_brief/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: false
        disabledStages: []
        descriptionEn: List event fields by strategy (brief). Returns field_name and display_name, deduplicated by field_name.
  /risks/{id}/:
    get:
      operationId: retrieve_risk
      description: 获取风险详情
      tags: []
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: 风险ID
      responses:
        "200":
          description: 成功
          schema:
            type: object
            properties:
              risk_id:
                type: string
                description: 风险ID
              event_content:
                type: string
                description: 风险描述
              raw_event_id:
                type: string
                description: 原始事件ID
              strategy_id:
                type: integer
                description: 策略ID
              event_evidence:
                type: string
                description: 风险证据
              event_type:
                type: array
                items:
                  type: string
                description: 风险类型
              event_data:
                type: object
                description: 事件数据
              event_time:
                type: string
                format: date-time
                description: 首次发现时间
              event_end_time:
                type: string
                format: date-time
                description: 最后发现时间
              event_source:
                type: string
                description: 事件来源
              operator:
                type: array
                items:
                  type: string
                description: 责任人
              status:
                type: string
                description: 风险状态
                enum:
                  - stand_by
                  - new
                  - await_deal
                  - for_approve
                  - auto_process
                  - closed
              rule_id:
                type: integer
                description: 处理规则ID
              rule_version:
                type: integer
                description: 处理规则版本
              origin_operator:
                type: array
                items:
                  type: string
                description: 初始处理人
              current_operator:
                type: array
                items:
                  type: string
                description: 当前处理人
              notice_users:
                type: array
                items:
                  type: string
                description: 关注人
              risk_label:
                type: string
                description: 风险标记
                enum:
                  - normal
                  - misreport
              last_operate_time:
                type: string
                format: date-time
                description: 最后操作时间
              title:
                type: string
                description: 风险标题
              tags:
                type: array
                items:
                  type: integer
                description: 标签ID列表
              ticket_history:
                type: array
                description: 单据流转历史
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: 节点ID（UUID）
                    risk_id:
                      type: string
                      description: 风险ID
                    action:
                      type: string
                      description: 操作类型
                    operator:
                      type: string
                      description: 操作人
                    current_operator:
                      type: array
                      items:
                        type: string
                      description: 当前处理人
                    timestamp:
                      type: number
                      format: float
                      description: 操作时间戳
                    time:
                      type: string
                      description: 操作时间（格式化字符串）
                    process_result:
                      type: object
                      description: 处理结果
                    status:
                      type: string
                      description: 节点状态
                      enum:
                        - running
                        - success
                        - failed
              unsynced_events:
                type: array
                description: 未同步的手动事件
                items:
                  type: object
                  properties:
                    manual_event_id:
                      type: integer
                      description: 手动事件ID
                    event_time:
                      type: string
                      format: date-time
                      description: 事件时间
                    event_data:
                      type: object
                      description: 事件数据
              created_at:
                type: string
                format: date-time
                description: 创建时间
              created_by:
                type: string
                description: 创建人
              updated_at:
                type: string
                format: date-time
                description: 更新时间
              updated_by:
                type: string
                description: 更新人
              manual_synced:
                type: boolean
                description: 手动建的单是否已同步
                default: true
        default:
          description: ""
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: get
          path: /api/v1/risk_apigw/{id}/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: false
        disabledStages: []
        descriptionEn:
  /risks/{id}/strategy_info/:
    get:
      operationId: retrieve_risk_strategy_info
      description: >-
        获取风险关联策略的可下钻字段配置。MCP Agent 应先调用本接口读取字段的 drill_config，
        再调用 execute_tool：path uid 使用 drill_config.tool.uid，body.caller_resource_type 传 risk，
        body.caller_resource_id 传当前风险ID，body.drill_field 传所选字段的 field_name，
        body.params.tool_variables 按 drill_config.config 生成。target_value_type=fixed_value 时直接使用
        target_value；target_value_type=field 时从风险事件数据中读取 target_value 指定的字段值。
      tags: []
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: 风险ID；后续调用 execute_tool 时作为 caller_resource_id 使用。
      responses:
        "200":
          description: 成功
          schema:
            type: object
            properties:
              risk_level:
                type: string
                description: 风险等级
                enum:
                  - LOW
                  - MIDDLE
                  - HIGH
              risk_hazard:
                type: string
                description: 风险危害
              risk_guidance:
                type: string
                description: 处理指引
              event_basic_field_configs:
                type: array
                description: 事件基础字段配置。APIGW 默认仅返回配置了 drill_config 的字段，可作为 execute_tool.drill_field。
                items:
                  type: object
                  properties:
                    field_name:
                      type: string
                      description: 字段名
                    display_name:
                      type: string
                      description: 显示名称
                    is_priority:
                      type: boolean
                      description: 是否优先展示
                    description:
                      type: string
                      description: 字段描述
                    drill_config:
                      type: array
                      description: >-
                        当前字段可用的下钻工具配置。每个元素对应一个可调用工具；调用 execute_tool 时，
                        path uid 使用 tool.uid，body.drill_field 使用当前字段的 field_name，
                        body.params.tool_variables 按 config 逐项生成。
                      items:
                        type: object
                        properties:
                          tool:
                            type: object
                            description: 下钻工具信息。真正调用 execute_tool 时以 tool.uid 作为 path 参数 uid。
                            properties:
                              uid:
                                type: string
                                description: 工具唯一标识，对应 execute_tool 的 path 参数 uid。
                              version:
                                type: integer
                                description: 策略配置时关联的工具版本，用于识别配置来源；execute_tool 会执行当前可用工具。
                          config:
                            type: array
                            description: >-
                              下钻变量映射列表。每个元素描述 execute_tool.params.tool_variables 中一个
                              raw_name/value 如何从固定值或风险事件数据生成。
                            items:
                              type: object
                              properties:
                                source_field:
                                  type: string
                                  description: execute_tool.params.tool_variables[].raw_name，即目标工具的入参变量名，不是风险字段名。
                                target_value_type:
                                  type: string
                                  description: >-
                                    取值来源类型。fixed_value 表示工具变量 value 直接使用 target_value；
                                    field 表示工具变量 value 需要从风险事件记录中读取 target_value 指定的字段。
                                target_field_type:
                                  type: string
                                  description: >-
                                    target_value_type=field 时的风险字段来源。basic 表示从事件记录顶层字段取值；
                                    data/evidence 等非 basic 来源按事件扩展数据 event_data 取值；
                                    fixed_value 时可为空。
                                target_value:
                                  type: string
                                  description: >-
                                    目标值。target_value_type=fixed_value 时表示要传给工具变量的固定值；
                                    target_value_type=field 时表示风险事件字段名，Agent 应从风险事件数据读取该字段值。
                          drill_name:
                            type: string
                            description: 下钻工具展示名称，便于选择工具；真正调用以 tool.uid 为准。
                    is_show:
                      type: boolean
                      description: 是否展示
                    duplicate_field:
                      type: boolean
                      description: 是否去重字段
                    field_type:
                      type: string
                      description: 字段类型
              event_data_field_configs:
                type: array
                description: 事件数据字段配置。APIGW 默认仅返回配置了 drill_config 的字段，可作为 execute_tool.drill_field。
                items:
                  type: object
                  properties:
                    field_name:
                      type: string
                      description: 字段名
                    display_name:
                      type: string
                      description: 显示名称
                    is_priority:
                      type: boolean
                      description: 是否优先展示
                    description:
                      type: string
                      description: 字段描述
                    enum_mappings:
                      type: object
                      description: 枚举映射配置（当 prohibit_enum_mappings=true 时不返回）
                      properties:
                        related_type:
                          type: string
                          description: 关联类型
                        related_object_id:
                          type: string
                          description: 关联对象ID
                        collection_id:
                          type: string
                          description: 枚举集合ID
                        mappings:
                          type: array
                          description: 枚举映射列表
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                description: 枚举值
                              name:
                                type: string
                                description: 枚举名称
                    drill_config:
                      type: array
                      description: >-
                        当前字段可用的下钻工具配置。每个元素对应一个可调用工具；调用 execute_tool 时，
                        path uid 使用 tool.uid，body.drill_field 使用当前字段的 field_name，
                        body.params.tool_variables 按 config 逐项生成。
                      items:
                        type: object
                        properties:
                          tool:
                            type: object
                            description: 下钻工具信息。真正调用 execute_tool 时以 tool.uid 作为 path 参数 uid。
                            properties:
                              uid:
                                type: string
                                description: 工具唯一标识，对应 execute_tool 的 path 参数 uid。
                              version:
                                type: integer
                                description: 策略配置时关联的工具版本，用于识别配置来源；execute_tool 会执行当前可用工具。
                          config:
                            type: array
                            description: >-
                              下钻变量映射列表。每个元素描述 execute_tool.params.tool_variables 中一个
                              raw_name/value 如何从固定值或风险事件数据生成。
                            items:
                              type: object
                              properties:
                                source_field:
                                  type: string
                                  description: execute_tool.params.tool_variables[].raw_name，即目标工具的入参变量名，不是风险字段名。
                                target_value_type:
                                  type: string
                                  description: >-
                                    取值来源类型。fixed_value 表示工具变量 value 直接使用 target_value；
                                    field 表示工具变量 value 需要从风险事件记录中读取 target_value 指定的字段。
                                target_field_type:
                                  type: string
                                  description: >-
                                    target_value_type=field 时的风险字段来源。basic 表示从事件记录顶层字段取值；
                                    data/evidence 等非 basic 来源按事件扩展数据 event_data 取值；
                                    fixed_value 时可为空。
                                target_value:
                                  type: string
                                  description: >-
                                    目标值。target_value_type=fixed_value 时表示要传给工具变量的固定值；
                                    target_value_type=field 时表示风险事件字段名，Agent 应从风险事件数据读取该字段值。
                          drill_name:
                            type: string
                            description: 下钻工具展示名称，便于选择工具；真正调用以 tool.uid 为准。
                    is_show:
                      type: boolean
                      description: 是否展示
                    duplicate_field:
                      type: boolean
                      description: 是否去重字段
                    field_type:
                      type: string
                      description: 字段类型
              event_evidence_field_configs:
                type: array
                description: 事件证据字段配置。APIGW 默认仅返回配置了 drill_config 的字段，可作为 execute_tool.drill_field。
                items:
                  type: object
                  properties:
                    field_name:
                      type: string
                      description: 字段名
                    display_name:
                      type: string
                      description: 显示名称
                    is_priority:
                      type: boolean
                      description: 是否优先展示
                    description:
                      type: string
                      description: 字段描述
                    enum_mappings:
                      type: object
                      description: 枚举映射配置（当 prohibit_enum_mappings=true 时不返回）
                      properties:
                        related_type:
                          type: string
                          description: 关联类型
                        related_object_id:
                          type: string
                          description: 关联对象ID
                        collection_id:
                          type: string
                          description: 枚举集合ID
                        mappings:
                          type: array
                          description: 枚举映射列表
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                description: 枚举值
                              name:
                                type: string
                                description: 枚举名称
                    drill_config:
                      type: array
                      description: >-
                        当前字段可用的下钻工具配置。每个元素对应一个可调用工具；调用 execute_tool 时，
                        path uid 使用 tool.uid，body.drill_field 使用当前字段的 field_name，
                        body.params.tool_variables 按 config 逐项生成。
                      items:
                        type: object
                        properties:
                          tool:
                            type: object
                            description: 下钻工具信息。真正调用 execute_tool 时以 tool.uid 作为 path 参数 uid。
                            properties:
                              uid:
                                type: string
                                description: 工具唯一标识，对应 execute_tool 的 path 参数 uid。
                              version:
                                type: integer
                                description: 策略配置时关联的工具版本，用于识别配置来源；execute_tool 会执行当前可用工具。
                          config:
                            type: array
                            description: >-
                              下钻变量映射列表。每个元素描述 execute_tool.params.tool_variables 中一个
                              raw_name/value 如何从固定值或风险事件数据生成。
                            items:
                              type: object
                              properties:
                                source_field:
                                  type: string
                                  description: execute_tool.params.tool_variables[].raw_name，即目标工具的入参变量名，不是风险字段名。
                                target_value_type:
                                  type: string
                                  description: >-
                                    取值来源类型。fixed_value 表示工具变量 value 直接使用 target_value；
                                    field 表示工具变量 value 需要从风险事件记录中读取 target_value 指定的字段。
                                target_field_type:
                                  type: string
                                  description: >-
                                    target_value_type=field 时的风险字段来源。basic 表示从事件记录顶层字段取值；
                                    data/evidence 等非 basic 来源按事件扩展数据 event_data 取值；
                                    fixed_value 时可为空。
                                target_value:
                                  type: string
                                  description: >-
                                    目标值。target_value_type=fixed_value 时表示要传给工具变量的固定值；
                                    target_value_type=field 时表示风险事件字段名，Agent 应从风险事件数据读取该字段值。
                          drill_name:
                            type: string
                            description: 下钻工具展示名称，便于选择工具；真正调用以 tool.uid 为准。
                    is_show:
                      type: boolean
                      description: 是否展示
                    duplicate_field:
                      type: boolean
                      description: 是否去重字段
                    field_type:
                      type: string
                      description: 字段类型
              risk_meta_field_config:
                type: array
                description: 风险元字段配置。APIGW 默认仅返回配置了 drill_config 的字段；如需从风险事件数据取值，优先使用 basic/data/evidence 字段组。
                items:
                  type: object
                  properties:
                    field_name:
                      type: string
                      description: 字段名
                    display_name:
                      type: string
                      description: 显示名称
                    is_priority:
                      type: boolean
                      description: 是否优先展示
                    description:
                      type: string
                      description: 字段描述
                    enum_mappings:
                      type: object
                      description: 枚举映射配置（当 prohibit_enum_mappings=true 时不返回）
                      properties:
                        related_type:
                          type: string
                          description: 关联类型
                        related_object_id:
                          type: string
                          description: 关联对象ID
                        collection_id:
                          type: string
                          description: 枚举集合ID
                        mappings:
                          type: array
                          description: 枚举映射列表
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                description: 枚举值
                              name:
                                type: string
                                description: 枚举名称
                    drill_config:
                      type: array
                      description: >-
                        当前字段可用的下钻工具配置。每个元素对应一个可调用工具；调用 execute_tool 时，
                        path uid 使用 tool.uid，body.drill_field 使用当前字段的 field_name，
                        body.params.tool_variables 按 config 逐项生成。
                      items:
                        type: object
                        properties:
                          tool:
                            type: object
                            description: 下钻工具信息。真正调用 execute_tool 时以 tool.uid 作为 path 参数 uid。
                            properties:
                              uid:
                                type: string
                                description: 工具唯一标识，对应 execute_tool 的 path 参数 uid。
                              version:
                                type: integer
                                description: 策略配置时关联的工具版本，用于识别配置来源；execute_tool 会执行当前可用工具。
                          config:
                            type: array
                            description: >-
                              下钻变量映射列表。每个元素描述 execute_tool.params.tool_variables 中一个
                              raw_name/value 如何从固定值或风险事件数据生成。
                            items:
                              type: object
                              properties:
                                source_field:
                                  type: string
                                  description: execute_tool.params.tool_variables[].raw_name，即目标工具的入参变量名，不是风险字段名。
                                target_value_type:
                                  type: string
                                  description: >-
                                    取值来源类型。fixed_value 表示工具变量 value 直接使用 target_value；
                                    field 表示工具变量 value 需要从风险事件记录中读取 target_value 指定的字段。
                                target_field_type:
                                  type: string
                                  description: >-
                                    target_value_type=field 时的风险字段来源。basic 表示从事件记录顶层字段取值；
                                    data/evidence 等非 basic 来源按事件扩展数据 event_data 取值；
                                    fixed_value 时可为空。
                                target_value:
                                  type: string
                                  description: >-
                                    目标值。target_value_type=fixed_value 时表示要传给工具变量的固定值；
                                    target_value_type=field 时表示风险事件字段名，Agent 应从风险事件数据读取该字段值。
                          drill_name:
                            type: string
                            description: 下钻工具展示名称，便于选择工具；真正调用以 tool.uid 为准。
                    is_show:
                      type: boolean
                      description: 是否展示
                    duplicate_field:
                      type: boolean
                      description: 是否去重字段
                    field_type:
                      type: string
                      description: 字段类型
        default:
          description: ""
