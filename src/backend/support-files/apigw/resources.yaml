  /mcp/{namespace}/tools/{uid}/execute/:
    post:
      operationId: mcp_execute_tool
      description: >-
        使用真实用户身份执行工具。默认直接执行：只传 params，不得传 caller_resource_type、
        caller_resource_id、drill_field、event_start_time、event_end_time，后端按用户的工具使用权限鉴权。
        仅当 path uid 来自当前风险 mcp_retrieve_risk_strategy_info 返回字段的 drill_config.tool.uid 时，才使用风险下钻模式：
        必须同时传入 caller_resource_type=risk、caller_resource_id=当前风险ID、drill_field=该 drill_config 所属字段的 field_name、
        event_start_time/event_end_time=同一风险 mcp_retrieve_risk 返回的 event_time/event_end_time，且按 drill_config.config
        组装 params.tool_variables。仅 params.tool_variables 非空不代表风险下钻，不能据此传 caller 上下文。
      tags: []
      parameters:
        - in: path
          name: namespace
          type: string
          required: true
          description: 命名空间
        - in: path
          name: uid
          type: string
          required: true
          description: 工具唯一标识；风险下钻时使用 retrieve_risk_strategy_info 返回的 drill_config.tool.uid。
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - params
            properties:
              params:
                type: object
                description: 工具执行参数。普通执行按工具自身参数传入；风险下钻时按 retrieve_risk_strategy_info 返回的 drill_config.config 组装 tool_variables。仅 tool_variables 非空不代表风险下钻。
                properties:
                  tool_variables:
                    type: array
                    description: >-
                      工具变量列表。风险下钻时每一项由 drill_config.config 生成：
                      raw_name 使用 source_field，value 按 target_value_type/target_value/target_field_type
                      从固定值或风险事件数据中取值。
                    items:
                      type: object
                      properties:
                        raw_name:
                          type: string
                          description: 工具变量原始名称；风险下钻时填写 drill_config.config[].source_field。
                        value:
                          type: string
                          description: >-
                            工具变量值，类型根据工具变量决定（string/number/array 等）。风险下钻时：
                            fixed_value 直接填写 target_value；field 从风险事件记录中读取 target_value 指定的字段值。
                  page:
                    type: integer
                    description: 页码（仅 data_search 类型）
                    default: 1
                  page_size:
                    type: integer
                    description: 每页数量（仅 data_search 类型）
                    default: 100
              caller_resource_type:
                type: string
                description: 风险下钻上下文。普通工具执行不得传；仅当 path uid 来自当前风险策略字段的 drill_config.tool.uid 时传 risk。
              caller_resource_id:
                type: string
                description: 风险下钻上下文。普通工具执行不得传；风险下钻时传当前风险ID，应与 retrieve_risk_strategy_info 的 risk_id 一致。
              drill_field:
                type: string
                description: >-
                  风险下钻上下文。普通工具执行不得传；风险下钻时传当前 uid 所在 drill_config 对应字段的 field_name，
                  后端仅使用该字段下与当前 uid 匹配的 config 校验 params.tool_variables。
              event_start_time:
                type: string
                description: >-
                  风险下钻上下文。普通工具执行不得传；风险下钻时使用 mcp_retrieve_risk 返回的 event_time，
                  用于后端读取风险事件数据并校验变量值。
              event_end_time:
                type: string
                description: >-
                  风险下钻上下文。普通工具执行不得传；风险下钻时使用 mcp_retrieve_risk 返回的 event_end_time，
                  用于后端读取风险事件数据并校验变量值。
      responses:
        "200":
          description: 执行成功
          schema:
            type: object
            required:
              - data
              - tool_type
            properties:
              data:
                type: object
                description: 执行结果数据，结构根据 tool_type 不同而不同
              tool_type:
                type: string
                description: 工具类型
                enum:
                  - data_search
                  - api
                  - bk_vision
        default:
          description: ""
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /api/v1/namespaces/{namespace}/mcp_user/tool/{uid}/execute/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          appVerifiedRequired: true
          userVerifiedRequired: true
          resourcePermissionRequired: true
        disabledStages: []
        descriptionEn:
