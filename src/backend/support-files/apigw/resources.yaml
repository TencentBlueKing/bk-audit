              risk_id:
                type: string
                description: 风险ID（多个用逗号分隔）
              strategy_id:
                type: string
                description: 策略ID（多个用逗号分隔）
              scope_type:
                type: string
                description: 场景选择器范围类型。不传表示不过滤场景范围；传 scope_id 时必须传 scope_type。
                enum:
                  - cross_scene
                  - cross_system
                  - scene
                  - system
              scope_id:
                type: string
                description: 范围实例 ID。scope_type 为 scene/system 时必传；cross_scene/cross_system 时不传。
              scene_id:
                type: string
                description: 场景ID（多个用逗号分隔）。用于在权限域结果内按风险所属场景筛选。
              operator:
                type: string
                description: 责任人（支持模糊匹配）
              status:
                type: string
                description: 风险状态（多个用逗号分隔）
                enum:
                  - stand_by
                  - new
                  - await_deal
                  - for_approve
                  - auto_process
                  - closed
              start_time:
                type: string
                format: date-time
                description: 开始时间（格式：YYYY-MM-DD HH:MM:SS）
              end_time:
                type: string
                format: date-time
