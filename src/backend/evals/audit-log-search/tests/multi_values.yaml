# 海量多值场景：操作人数量梯度、分隔形态混排、多字段多值并行、拓展字段多值、中英文与大小写、泛指不猜。
# 固定时钟 2026-08-31T18:00:00+08:00（周一）；缺省时间 = 7 天滚动窗口（与 core_filters C2 对齐）。
# 核心断言目标：多值必须完整提取（N 个值 → filters 恰好 N 个）、单条件 include、值保持原样不转写、不串字段。

