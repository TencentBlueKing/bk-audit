# 业务场景与组合复杂度：安全审计/权限审计/非工作时间/故障排查/时间复杂语义/多从句嵌套/对抗注入/极限长句。
# 固定时钟 2026-08-31T18:00:00+08:00（周一）；缺省时间 = 7 天滚动窗口。
# 设计原则：贴近真实审计业务的问法，而非人造语法题；期望值按生产 prompt 规则推导（枚举不确定禁猜→全文关键词等）。

# ---- S1-S4：安全/权限审计业务场景 ----
- description: 'S1-安全审计：删除行为（动作词提取不稳定，观察）'
  vars:
    query: '上周有没有人删除了什么重要的东西，帮我查一下'
    current_time: '2026-08-31T18:00:00+08:00'
    limitation_reason: '安全审计口语话术（删除了什么重要的东西）的动作词提取在 删除/重要/重要的东西 间抖动（v2-v4 三轮三种行为），User Message 动作词优先规则增强后仍不稳定；属模型能力边界，观察并作为 AIDev System Prompt 迭代输入'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:known_limitation_observer'

- description: 'S2-权限审计：谁给自己加了权限（隐含语义 → 权限关键词；"最近"窗口 30/31 天弹性）'
  vars:
    query: '最近有没有人偷偷给自己加权限，查一下'
    current_time: '2026-08-31T18:00:00+08:00'
    expected_log_keywords: '["权限"]'
    window_start_floor: '2026-07-31T18:00:00+08:00'
    window_start_ceiling: '2026-08-01T18:00:00+08:00'
    window_end_floor: '2026-08-31T17:00:00+08:00'
    window_end_ceiling: '2026-08-31T18:00:00+08:00'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:success_condition_is_valid'
    - type: python
      value: 'file://assertions/check_conditions.py:log_keyword_contains'
    - type: python
      value: 'file://assertions/check_conditions.py:time_window_within_bounds'

- description: 'S3-高危组合：admin 账号 + API 渠道 + 失败（三条件）'
  vars:
    query: '查一下admin这个账号通过API做的那些失败的操作'
    current_time: '2026-08-31T18:00:00+08:00'
    expected_conditions:
      - raw_name: 'username'
        keys: []
        operator: 'eq'
        filters: ['admin']
      - raw_name: 'access_type'
        keys: []
        operator: 'include'
        filters: ['API']
      - raw_name: 'result_code'
        keys: []
        operator: 'include'
        filters: [-1]
    expected_start_time: '2026-08-01T18:00:00+08:00'
    expected_end_time: '2026-08-31T18:00:00+08:00'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:success_condition_is_valid'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_conditions_match'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_time_window_match'

- description: 'S4-故障排查：特定工单出问题时相关人员的操作（拓展字段 + 时间）'
  vars:
    query: 'Story-3000 这个工单昨天出问题了，帮我看看昨天相关的操作'
    current_time: '2026-08-31T18:00:00+08:00'
    expected_conditions:
      - raw_name: 'extend_data'
        keys: ['ticket_id']
        operator: 'eq'
        filters: ['Story-3000']
    expected_start_time: '2026-08-30T00:00:00+08:00'
    expected_end_time: '2026-08-30T23:59:59+08:00'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:success_condition_is_valid'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_conditions_match'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_time_window_match'

# ---- S5-S8：时间复杂语义 ----
- description: 'S5-非工作时间：昨天晚上十一点以后（开放终点弹性）'
  vars:
    query: '昨天晚上十一点以后张三做的操作'
    current_time: '2026-08-31T18:00:00+08:00'
    expected_conditions:
      - raw_name: 'username'
        keys: []
        operator: 'eq'
        filters: ['张三']
    expected_start_time: '2026-08-30T23:00:00+08:00'
    expected_end_time: '2026-08-30T23:59:59+08:00'
    # "以后"为开放区间：终点到昨日末（封闭理解）或当前时间（持续理解）均合法
    expected_end_time_alts: '["2026-08-31T18:00:00+08:00"]'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:success_condition_is_valid'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_conditions_match'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_time_window_match'

- description: 'S6-周内区间：上周一到上周三'
  vars:
    query: '查一下上周一到上周三的操作日志'
    current_time: '2026-08-31T18:00:00+08:00'
    expected_conditions: []
    expected_start_time: '2026-08-24T00:00:00+08:00'
    expected_end_time: '2026-08-26T23:59:59+08:00'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:success_condition_is_valid'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_conditions_match'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_time_window_match'

- description: 'S7-绝对+相对混合：8月28号到昨天'
  vars:
    query: '帮我看下8月28号到昨天的操作'
    current_time: '2026-08-31T18:00:00+08:00'
    expected_conditions: []
    expected_start_time: '2026-08-28T00:00:00+08:00'
    expected_end_time: '2026-08-30T23:59:59+08:00'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:success_condition_is_valid'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_conditions_match'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_time_window_match'

- description: 'S8-模糊时间指代（出问题那段时间，观察）'
  vars:
    query: '查一下出问题那段时间的操作'
    current_time: '2026-08-31T18:00:00+08:00'
    limitation_reason: '模糊时间指代（出问题那段时间）单轮无上下文不可定位；观察模型是否退化为默认窗口或稳定拒绝'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:known_limitation_observer'

