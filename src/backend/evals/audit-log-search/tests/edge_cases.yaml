- description: 'E6-已知限制观察：数值范围比较（白名单不支持 gt，观察降级行为）'
  vars:
    query: '查一下响应时间大于1秒的日志'
    current_time: '2026-08-31T18:00:00+08:00'
    limitation_reason: '字段白名单不支持数值范围操作符（F6 §5 已知边界），观察模型是否编造 gt 条件或安全降级'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:known_limitation_observer'

- description: 'E7-已知限制观察：否定语义（白名单不支持 neq，观察降级行为）'
  vars:
    query: '查一下不是通过 API 调用的操作'
    current_time: '2026-08-31T18:00:00+08:00'
    limitation_reason: '标准字段白名单不支持 neq（F6 §5 已知边界），观察模型是否编造否定条件或安全降级'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:known_limitation_observer'

- description: 'E8-拓展字段否定：neq/exclude 单值等价（白名单支持）'
  vars:
    query: '查一下工单号不是 Story-3000 的操作'
