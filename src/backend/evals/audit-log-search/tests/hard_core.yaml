# 精准回归子集：只含历史失败/优化目标用例（镜像自 multi_values.yaml 与 scenario_combinations.yaml，源头修改须同步本文件）。
# 固定时钟 2026-08-31T18:00:00+08:00（周一）。用于 prompt 调优的分钟级快速验证，全量回归用 promptfooconfig.yaml。

# ---- A5：多值完整性上限（v2 漏 1 人 → 规则 4 逐项自检验证目标）----
- description: 'A5-多值梯度12人：混合分隔（顿号+逗号+以及+还有）+ 上周'
  vars:
    query: '张三、李四，王五以及赵六，还有钱七、孙八、周九、吴十、郑一、王二、冯三、陈四上周的操作'
    current_time: '2026-08-31T18:00:00+08:00'
    expected_conditions:
      - raw_name: 'username'
        keys: []
        operator: 'include'
        filters: ['张三', '李四', '王五', '赵六', '钱七', '孙八', '周九', '吴十', '郑一', '王二', '冯三', '陈四']
    expected_start_time: '2026-08-24T00:00:00+08:00'
    expected_end_time: '2026-08-30T23:59:59+08:00'
  assert:
    - type: python
      value: 'file://assertions/check_conditions.py:valid_protocol_response'
    - type: python
      value: 'file://assertions/check_conditions.py:success_condition_is_valid'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_conditions_match'
    - type: python
      value: 'file://assertions/check_conditions.py:exact_time_window_match'

