# 场景②：纯日志检索（已有系统，话语不提系统 → 计划直接使用当前系统）
- description: '纯检索需求（未提及系统，已有当前系统）'
  vars:
    query: '查一下最近登录失败的记录'
    current_system_id: 'eval_audit_system'
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.outcome === "dispatch" && d.messages.length === 1 && d.messages[0].message_type === "LOG_SEARCH" && d.system_id === "eval_audit_system"'

- description: '纯检索需求（时间+条件，未提系统）'
  vars:
    query: '看下张三近七天的操作日志'
    current_system_id: 'eval_bcs_system'
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.outcome === "dispatch" && d.messages.length === 1 && d.messages[0].message_type === "LOG_SEARCH" && d.system_id === "eval_bcs_system"'

- description: '纯检索需求（新对话未选系统，识别层仍应判 log_search——SYSTEM_REQUIRED 由平台守门）'
  vars:
    query: '帮我查最近一天的高危操作'
    current_system_id: ''
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.outcome === "error" && d.error_code === "SYSTEM_REQUIRED"'

- description: '纯检索需求（关键词检索，未提系统）'
  vars:
    query: '搜一下权限变更相关的日志'
    current_system_id: 'eval_config_system'
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.outcome === "dispatch" && d.messages.length === 1 && d.messages[0].message_type === "LOG_SEARCH" && d.system_id === "eval_config_system"'
