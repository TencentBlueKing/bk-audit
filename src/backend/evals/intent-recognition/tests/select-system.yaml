# 场景③：选系统+检索 / 场景①：纯选系统 / 命中当前系统复用
# 期望：intent=select_system 且 system_id 命中候选内目标系统
- description: '选系统+日志检索（新对话，完整意图）'
  vars:
    query: '我要看审计中心近七天 hermit 的操作记录'
    current_system_id: ''
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.intent === "select_system" && d.system_id === "eval_audit_system" && d.messages.length === 2 && d.messages[0].message_type === "SYSTEM_SELECTION" && d.messages[1].message_type === "LOG_SEARCH" && d.condition.conditions.some(c => c.field.raw_name === "username" && c.filters.includes("hermit"))'

- description: '选系统+日志检索（中途切换，已选审计中心说蓝盾）'
  vars:
    query: '我现在要看蓝盾 zhangsan 近七天的操作id是123的日志'
    current_system_id: 'eval_audit_system'
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.intent === "select_system" && d.system_id === "eval_bcs_system" && d.messages.length === 2 && d.messages[0].message_type === "SYSTEM_SELECTION" && d.messages[1].message_type === "LOG_SEARCH" && d.condition.conditions.some(c => c.field.raw_name === "username" && c.filters.includes("zhangsan")) && d.condition.conditions.some(c => c.field.raw_name === "action_id" && c.filters.map(String).includes("123"))'

- description: '纯选系统（切系统不带检索内容）'
  vars:
    query: '帮我切换到配置平台'
    current_system_id: 'eval_audit_system'
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.intent === "select_system" && d.system_id === "eval_config_system" && d.messages.length === 1 && d.messages[0].message_type === "SYSTEM_SELECTION" && d.condition === null'

- description: '首次选系统并检索（口语化）'
  vars:
    query: '我想查一下监控平台的东西'
    current_system_id: ''
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.intent === "select_system" && d.system_id === "eval_monitor_system" && d.messages.length === 2 && d.messages[0].message_type === "SYSTEM_SELECTION" && d.messages[1].message_type === "LOG_SEARCH"'

- description: '话语命中当前系统（无需重复选择，直接生成日志检索）'
  vars:
    query: '看下审计中心最近的操作记录'
    current_system_id: 'eval_audit_system'
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.outcome === "dispatch" && d.messages.length === 1 && d.messages[0].message_type === "LOG_SEARCH" && d.system_id === "eval_audit_system"'

- description: '系统名口语变体（用系统英文名/别名表达）'
  vars:
    query: '帮我在 bcs 上看看最近的发布日志'
    current_system_id: ''
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.intent === "select_system" && d.system_id === "eval_bcs_system" && d.messages.length === 2 && d.messages[0].message_type === "SYSTEM_SELECTION" && d.messages[1].message_type === "LOG_SEARCH"'
