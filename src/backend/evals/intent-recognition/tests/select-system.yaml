# 场景③：选系统+检索 / 场景①：纯选系统 / 命中当前系统复用
# 期望：intent=select_system 且 system_id 命中候选内目标系统
- description: '选系统+日志检索（新对话，完整意图）'
  vars:
    query: '我要看示例审计系统近七天 eval_user_alpha 的操作记录'
    current_system_id: ''
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.intent === "select_system" && d.system_id === "eval_audit_system" && d.messages.length === 2 && d.messages[0].message_type === "SYSTEM_SELECTION" && d.messages[1].message_type === "LOG_SEARCH" && d.condition.conditions.some(c => c.field.raw_name === "username" && c.filters.includes("eval_user_alpha"))'

- description: '选系统+日志检索（中途切换，已选示例审计系统说示例流水线系统）'
  vars:
    query: '我现在要看示例流水线系统 eval_user_beta 近七天的操作id是123的日志'
    current_system_id: 'eval_audit_system'
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.intent === "select_system" && d.system_id === "eval_pipeline_system" && d.messages.length === 2 && d.messages[0].message_type === "SYSTEM_SELECTION" && d.messages[1].message_type === "LOG_SEARCH" && d.condition.conditions.some(c => c.field.raw_name === "username" && c.filters.includes("eval_user_beta")) && d.condition.conditions.some(c => c.field.raw_name === "action_id" && c.filters.map(String).includes("123"))'

- description: '纯选系统（切系统不带检索内容）'
  vars:
    query: '帮我切换到示例配置系统'
    current_system_id: 'eval_audit_system'
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.intent === "select_system" && d.system_id === "eval_config_system" && d.messages.length === 1 && d.messages[0].message_type === "SYSTEM_SELECTION" && d.condition === null'

- description: '首次选系统并检索（口语化）'
  vars:
    query: '我想查一下示例监控系统的东西'
    current_system_id: ''
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.intent === "select_system" && d.system_id === "eval_monitor_system" && d.messages.length === 2 && d.messages[0].message_type === "SYSTEM_SELECTION" && d.messages[1].message_type === "LOG_SEARCH"'

- description: '话语命中当前系统（无需重复选择，直接生成日志检索）'
  vars:
    query: '看下示例审计系统最近的操作记录'
    current_system_id: 'eval_audit_system'
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.outcome === "dispatch" && d.messages.length === 1 && d.messages[0].message_type === "LOG_SEARCH" && d.system_id === "eval_audit_system"'

- description: '系统名口语变体（用系统英文名/别名表达）'
  vars:
    query: '帮我在示例流水线系统上看看最近的发布日志'
    current_system_id: ''
  assert:
    - type: javascript
      value: 'const d = JSON.parse(output); d.status === "success" && d.intent === "select_system" && d.system_id === "eval_pipeline_system" && d.messages.length === 2 && d.messages[0].message_type === "SYSTEM_SELECTION" && d.messages[1].message_type === "LOG_SEARCH"'
